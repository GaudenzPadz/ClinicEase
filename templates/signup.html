{% extends "base.html" %}

{% block title %}Register - ClinicEase{% endblock %}

{% block content %}
<div class="container-narrow">
    <div class="card" style="padding: 0; overflow: hidden;">
        <div class="modal-header">
            <h2>Create Patient Account</h2>
            <p style="font-size: 11px; margin-top: 2px;">Register to book and track your appointments</p>
        </div>

        <div style="padding: 24px;">
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            {% if message %}
            <div class="alert alert-success">{{ message }}</div>
            {% endif %}

            <form action="/register" method="POST">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" required placeholder="Juan Dela Cruz" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" required placeholder="patient@example.com" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" required placeholder="Minimum 6 characters" class="form-input">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 11px;">
                Already registered? <a href="/login" style="color: var(--color-sage); font-weight: 700;">Sign In here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
