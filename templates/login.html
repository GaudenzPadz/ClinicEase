{% extends "base.html" %}

{% block title %}Sign In - ClinicEase{% endblock %}

{% block content %}
<div class="container-narrow">
    <div class="card" style="padding: 0; overflow: hidden;">
        <div class="modal-header">
            <h2>Welcome Back</h2>
            <p style="font-size: 11px; margin-top: 2px;">Sign in to your ClinicEase account</p>
        </div>

        <div style="padding: 24px;">
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            {% if message %}
            <div class="alert alert-success">{{ message }}</div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" required placeholder="patient@example.com" class="form-input">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" required placeholder="••••••••" class="form-input">
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 11px;">
                Don't have an account? <a href="/register" style="color: var(--color-sage); font-weight: 700;">Register as a Patient</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
