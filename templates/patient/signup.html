<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClinicEase | Sign up</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-brand">
            <div class="brand-mark">C</div>
            <p class="eyebrow">A BETTER WAY TO BOOK</p>
            <h1>Make time for<br><em>your wellbeing.</em></h1>
            <p class="auth-copy">Create your account to request appointments and follow their status.</p>
            <div class="orbit"></div>
        </section>
        <section class="auth-form-panel">
            <div class="brand mobile-brand"><span class="brand-mark small">C</span> ClinicEase</div>
            <p class="eyebrow">GET STARTED</p>
            <h2>Create your account</h2>
            <p class="muted intro">Enter your details to get started.</p>
            <form id="signupForm" class="form-stack"><label>Full name<input type="text" placeholder="Your full name"
                        required></label><label>Email address<input type="email" placeholder="you@example.com"
                        required></label><label>Contact number<input type="tel" placeholder="09XX XXX XXXX"
                        required></label><label>Password<input type="password" minlength="6"
                        placeholder="At least 6 characters" required></label><button class="btn primary"
                    type="submit">Create account <span>→</span></button></form>
            <p class="form-foot">Already have an account? <a href="index.html">Sign in</a></p>
            <p class="demo-note">Demo frontend · Data is not saved to a database.</p>
        </section>
    </main>
    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>

</html>
